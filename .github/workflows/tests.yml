name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: "${{ matrix.python-version }}"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # The benchmarks are excluded here and run in benchmarks.yml instead. They
    # spend most of their time compiling rather than computing, because the
    # buffers are resized as observations accumulate, and a hosted runner is
    # slow enough at that to turn two minutes into well over half an hour.
    - name: Test with pytest
      run: |
        pytest -m "not slow"
